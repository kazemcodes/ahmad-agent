<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>مدیریت آقای ناظر</title><style>body{font-family:Tahoma;background:#f3f6f4;margin:0;padding:24px;color:#1d3731}h1{font-size:1.4rem}section{background:#fff;border:1px solid #dfe8e2;border-radius:10px;padding:16px;margin:16px 0}label{display:block;margin:8px 0}input,textarea,select{padding:8px;width:100%;box-sizing:border-box}button{padding:8px 16px;cursor:pointer}.row{display:flex;gap:8px}.danger{color:#c00}.list{margin-top:8px}</style></head>
<body><h1>مدیریت آقای ناظر</h1>
<section><h2>افزودن دانش‌آموز</h2><label>شناسه گفتگو (chat)<input id="chat1" type="number"></label><label>نام‌ها (هر خط یک نام)<textarea id="names" rows="4"></textarea></label><button onclick="postAction('add_roster',{chat:document.getElementById('chat1').value,names:document.getElementById('names').value})">ثبت</button></section>
<section><h2>افزودن زمان کلاس هفتگی</h2><label>شناسه گفتگو<input id="chat2" type="number"></label><div class="row"><label>روز (0=یکشنبه … 6=شنبه)<input id="wd" type="number" min="0" max="6"></label><label>شروع<input id="st" type="time"></label><label>پایان<input id="en" type="time"></label></div><button onclick="postAction('add_schedule',{chat:document.getElementById('chat2').value,weekday:document.getElementById('wd').value,start:document.getElementById('st').value,end:document.getElementById('en').value})">ثبت</button></section>
<p>برای امنیت، توکن داشبورد (اگر تنظیم شده) را در فیلد زیر وارد کن: <input id="token" placeholder="DASHBOARD_TOKEN"></p>
<p id="out"></p>
<script>async function postAction(a,b){const f=new FormData();f.append('action',a);f.append('token',document.getElementById('token').value);Object.entries(b).forEach(([k,v])=>f.append(k,v));const r=await fetch('data.php',{method:'POST',body:f});const j=await r.json();document.getElementById('out').textContent=j.ok?'انجام شد ✓':'خطا: '+(j.error||'');}</script>
</body></html>
